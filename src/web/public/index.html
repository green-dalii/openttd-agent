<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>openttd-agent · dashboard</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>openttd-agent <span class="dim">v0.1.0 observation loop</span></h1>
  <div class="stats">
    <div class="stat"><span class="lbl">Game date</span><span id="g-date" class="val">—</span></div>
    <div class="stat"><span class="lbl">Companies</span><span id="g-companies" class="val">—</span></div>
    <div class="stat"><span class="lbl">Events</span><span id="g-events" class="val">0</span></div>
    <div class="stat"><span class="lbl">Link</span><span id="g-link" class="val dim">…</span></div>
  </div>
</header>

<main>
  <section id="companies"></section>

  <section class="panel" id="llm-panel">
    <h2>LLM provider <span class="dim" id="llm-status">…</span></h2>
    <form id="llm-form" class="llm-form" autocomplete="off">
      <label>Base URL
        <input id="llm-base" type="text" placeholder="https://api.openai.com/v1" />
      </label>
      <label>Model
        <input id="llm-model" type="text" placeholder="gpt-4o-mini / deepseek-chat" />
      </label>
      <label>API key
        <input id="llm-key" type="password" placeholder="(unchanged)" />
      </label>
      <label>API
        <select id="llm-api">
          <option value="openai-completions">openai-completions</option>
          <option value="anthropic-messages">anthropic-messages</option>
        </select>
      </label>
      <label>Provider id
        <input id="llm-provider" type="text" placeholder="openttd-llm" />
      </label>
      <div class="llm-actions">
        <button type="submit">Save</button>
        <span id="llm-msg" class="dim"></span>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>Cash history (per company, per poll/quarter)</h2>
    <canvas id="chart" width="900" height="260"></canvas>
  </section>

  <section class="panel">
    <h2>Event stream <span class="dim">(newest last)</span></h2>
    <ol id="events" class="events"></ol>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
