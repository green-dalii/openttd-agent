<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>openttd-agent · sessions</title>
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
<header>
  <div class="brand">
    <h1>openttd-agent <span class="dim">sessions</span></h1>
    <div id="nav"></div>
  </div>
  <div class="stats">
    <div class="stat"><span class="lbl">Sessions</span><span id="s-count" class="val">…</span></div>
    <div class="stat"><span class="lbl">Completed</span><span id="s-done" class="val">…</span></div>
    <div class="stat"><span class="lbl">Tokens (all)</span><span id="s-tokens" class="val">…</span></div>
  </div>
</header>

<main>
  <section class="grid-2">
    <section class="panel">
      <h2>Game sessions <span class="dim">(newest first)</span></h2>
      <ul id="session-list" class="picker tall"></ul>
    </section>

    <section class="panel">
      <h2>Replay <span class="dim" id="replay-title">select a session</span></h2>
      <div id="session-detail"><p class="empty">Pick a session on the left to inspect its outcome, staged summaries and event log.</p></div>
    </section>
  </section>

  <section class="panel" id="detail-steps-panel" hidden>
    <h2>Agent steps <span class="dim" id="detail-steps-count"></span></h2>
    <ol id="detail-steps" class="steps"></ol>
  </section>
</main>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/sessions.js"></script>
</body>
</html>
